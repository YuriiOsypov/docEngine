<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DocEngine — Document template builder</title>

  </head>

  <body>

    <div class="page">

      <div class="page-sticky-chrome">

      <header class="page-header">

        <h1>Document template builder</h1>

        <div class="export-bar" role="toolbar" aria-label="Export and import">

          <div class="page-actions__mode">

            <div class="page-actions__document"></div>

            <label class="design-toggle">

              <input type="checkbox" id="design-mode-toggle" />

              Design mode

            </label>

          </div>

          <div class="export-group">

            <button type="button" id="btn-save-template" class="export-btn export-btn--first" title="Save template">

              <span class="export-btn__icon" aria-hidden="true">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

              </span>

              Template

            </button>

            <button type="button" id="btn-save-fields" class="export-btn" title="Save values">

              <span class="export-btn__icon" aria-hidden="true">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

              </span>

              Values

            </button>

            <button type="button" id="btn-save-full-document" class="export-btn" title="Save full document">

              <span class="export-btn__icon" aria-hidden="true">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

              </span>

              Full document

            </button>

            <button type="button" id="btn-save-mapping" class="export-btn" title="Save template with mapping">

              <span class="export-btn__icon" aria-hidden="true">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

              </span>

              Mapping

            </button>

            <button type="button" id="btn-edit-mapping" class="export-btn export-btn--last" title="Edit field mapping">

              <span class="export-btn__icon" aria-hidden="true">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>

              </span>

              Edit

            </button>

          </div>

          <span class="export-bar__divider" aria-hidden="true"></span>

          <label class="export-btn export-btn--solo" title="Import JSON — document, template, values, or mapping">

            <span class="export-btn__icon" aria-hidden="true">

              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>

            </span>

            Import

            <input type="file" id="btn-import" accept="application/json,.json" hidden />

          </label>

        </div>

      </header>

      </div>

      <main id="editorjs" class="editor-holder"></main>

    </div>

    <script type="module" src="/src/main.ts"></script>

  </body>

</html>
