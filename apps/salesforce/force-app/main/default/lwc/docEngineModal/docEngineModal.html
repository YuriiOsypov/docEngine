<template>
  <lightning-modal-header label={modalHeaderLabel}></lightning-modal-header>

  <lightning-modal-body>
    <div class={shellClass}>
      <template if:true={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
          <span>{errorMessage}</span>
        </div>
      </template>

      <template if:true={showSpinner}>
        <div class="waiting-row">
          <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
          <p class="slds-text-body_small slds-text-color_weak">Loading preview…</p>
        </div>
      </template>

      <template if:true={showEditor}>
        <!-- Preview (+ format chrome) and scenario toggle share one toolbar row -->
        <div class="chrome-row fill-chrome">
          <div class="chrome-row__editor">
            <div lwc:dom="manual" class="doc-editor-host__sticky sticky-chrome"></div>
            <div lwc:dom="manual" class="doc-editor-host__actions doc-actions"></div>
          </div>
          <template if:true={showScenarioBar}>
            <div class="scenario-toggle">
              <lightning-input
                type="checkbox"
                label="Use scenario"
                checked={scenarioPanelOpen}
                onchange={handleScenarioPanelToggle}
                disabled={busy}
              ></lightning-input>
            </div>
          </template>
        </div>

        <template if:true={showScenarioBar}>
          <template if:true={scenarioPanelOpen}>
            <div class="scenario-row">
              <lightning-combobox
                label="Scenario"
                value={selectedValueSetId}
                options={valueSetOptions}
                placeholder={valueSetPlaceholder}
                onchange={handleValueSetChange}
                disabled={busy}
                class="scenario-combobox"
              ></lightning-combobox>
              <lightning-button-group>
                <lightning-button
                  label="Load"
                  onclick={handleLoadScenario}
                  disabled={loadScenarioDisabled}
                ></lightning-button>
                <lightning-button
                  label="Save as"
                  onclick={handleSaveScenario}
                  disabled={busy}
                  title="Save current unmapped field values as a reusable scenario"
                ></lightning-button>
              </lightning-button-group>
            </div>
          </template>
        </template>

        <div
          lwc:dom="manual"
          class="doc-editor-root doc-editor-host doc-editor-host__surface editor-root"
        ></div>
      </template>

      <c-doc-engine-share-dialog></c-doc-engine-share-dialog>
    </div>
  </lightning-modal-body>

  <template lwc:if={showModalFooter}>
    <lightning-modal-footer>
      <div class="footer-row">
        <lightning-button-group>
          <lightning-button label="Cancel" onclick={handleCancel} disabled={busy}></lightning-button>
          <template if:true={showSaveDraft}>
            <lightning-button
              label="Save Draft"
              onclick={handleSaveDraft}
              disabled={busy}
            ></lightning-button>
          </template>
          <lightning-button
            variant="brand"
            label="Finish"
            onclick={handleFinish}
            disabled={busy}
          ></lightning-button>
        </lightning-button-group>
      </div>
    </lightning-modal-footer>
  </template>
</template>
