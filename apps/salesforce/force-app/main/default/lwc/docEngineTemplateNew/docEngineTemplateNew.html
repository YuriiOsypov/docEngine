<template>
  <lightning-card title="Create New Template" icon-name="standard:draft">
    <div class="slds-p-around_medium">
      <div class="slds-grid slds-gutters_small slds-wrap slds-m-bottom_medium form-row">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-input
            label="Template Name"
            value={templateName}
            onchange={handleNameChange}
            required
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-input
            label="Template Description"
            value={description}
            onchange={handleDescriptionChange}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-combobox
            label="Data Source"
            placeholder="Search Salesforce objects…"
            value={sourceObject}
            options={objectOptions}
            onchange={handleSourceChange}
            required
          ></lightning-combobox>
        </div>
      </div>

      <div class="slds-grid slds-grid_align-end">
        <lightning-button-group>
          <lightning-button label="Cancel" onclick={handleCancel} disabled={saving}></lightning-button>
          <lightning-button
            label="Create"
            variant="brand"
            onclick={handleCreate}
            disabled={createDisabled}
          ></lightning-button>
        </lightning-button-group>
      </div>
    </div>
  </lightning-card>
</template>
