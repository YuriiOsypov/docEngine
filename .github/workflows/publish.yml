# Publishes n8n-nodes-docengine to npm with a provenance attestation.
#
# Required for n8n Creator Portal verification (from May 1 2026).
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended):
# 1. npmjs.com → n8n-nodes-docengine → Settings → Trusted Publishers → GitHub Actions
# 2. Repository owner: YuriiOsypov
#    Repository name:  docEngine
#    Workflow name:    publish.yml
#
# Option B — set GitHub Actions secret NPM_TOKEN (granular automation token).
#
# Release: npm run release -w n8n-nodes-docengine

name: Publish

on:
  push:
    tags:
      - 'n8n-nodes-docengine-v*'

jobs:
  publish:
    name: Publish n8n-nodes-docengine
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: |
          test -f package-lock.json
          # Skip prepare/tsc on workspaces — the n8n bundle resolves DocEngine from source.
          npm install --no-fund --no-audit --ignore-scripts
          npm rebuild esbuild

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#n8n-nodes-docengine-v}"
          PKG="$(node -p "require('./apps/n8n-nodes-docengine/package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Test and scan bundle
        run: |
          npm test -w n8n-nodes-docengine
          npm run scan:bundle -w n8n-nodes-docengine

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm with provenance
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish -w n8n-nodes-docengine --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
