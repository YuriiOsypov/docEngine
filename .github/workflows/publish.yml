# Publishes n8n-nodes-docengine to npm with a provenance attestation.
#
# Required for n8n Creator Portal verification (from May 1 2026).
# Local `npm publish` is NOT accepted — only this GitHub Actions workflow.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
# 1. https://www.npmjs.com/package/n8n-nodes-docengine → Settings → Trusted Publishers
# 2. Add GitHub Actions publisher:
#      Repository owner: YuriiOsypov
#      Repository name:  docEngine
#      Workflow name:    publish.yml
#      Environment:      (leave blank)
# 3. Do NOT set NPM_TOKEN / NODE_AUTH_TOKEN in this repo.
#
# Option B — GitHub Actions secret NPM_TOKEN (granular automation token).
#
# Release (from monorepo root):
#   npm run release -w n8n-nodes-docengine
#   npm run release -w n8n-nodes-docengine -- 0.0.118

name: Publish

on:
  push:
    tags:
      - 'n8n-nodes-docengine-v*'

jobs:
  publish:
    name: Publish n8n-nodes-docengine
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance + Trusted Publishing.
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          # Do NOT set registry-url here. setup-node would write a placeholder
          # NODE_AUTH_TOKEN that makes `npm publish` return 404 and blocks OIDC.

      - name: Install dependencies
        run: |
          test -f package-lock.json
          # Skip prepare/tsc on workspaces — the n8n bundle resolves DocEngine from source.
          npm install --no-fund --no-audit --ignore-scripts
          npm rebuild esbuild

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#n8n-nodes-docengine-v}"
          PKG="$(node -p "require('./apps/n8n-nodes-docengine/package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Build, smoke-test, and scan bundle
        run: |
          npm run build -w n8n-nodes-docengine
          npm run smoke -w n8n-nodes-docengine
          npm run scan:bundle -w n8n-nodes-docengine

      - name: Publish to npm with provenance
        run: |
          # Clear any leftover auth that would override Trusted Publishing / OIDC.
          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG
          rm -f "$HOME/.npmrc"

          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
            echo "Using NPM_TOKEN secret for publish auth"
          else
            echo "Using npm Trusted Publishing (OIDC) — no NPM_TOKEN set"
          fi

          npm publish -w n8n-nodes-docengine --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
