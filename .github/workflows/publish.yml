# Publishes n8n-nodes-docengine to npm with a provenance attestation.
#
# Required for n8n Creator Portal verification (from May 1 2026).
# Local `npm publish` is NOT accepted — only this GitHub Actions workflow.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended):
#   npm trust github n8n-nodes-docengine \
#     --repo YuriiOsypov/docEngine --file publish.yml --allow-publish -y
#   Or UI: package Settings → Trusted Publishers → GitHub Actions
#     owner: YuriiOsypov  repo: docEngine  workflow: publish.yml
#     (must allow npm publish, not only stage publish)
#
# Option B — GitHub Actions secret NPM_TOKEN (granular automation token).
#
# Release: npm run release -w n8n-nodes-docengine

name: Publish

on:
  push:
    tags:
      - 'n8n-nodes-docengine-v*'

jobs:
  publish:
    name: Publish n8n-nodes-docengine
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: '24'
          cache: 'npm'
          # Do NOT set registry-url — placeholder NODE_AUTH_TOKEN breaks OIDC.

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Install dependencies
        run: |
          test -f package-lock.json
          npm install --no-fund --no-audit --ignore-scripts
          npm rebuild esbuild

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#n8n-nodes-docengine-v}"
          PKG="$(node -p "require('./apps/n8n-nodes-docengine/package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Build, smoke-test, and scan bundle
        run: |
          npm run build -w n8n-nodes-docengine
          npm run smoke -w n8n-nodes-docengine
          npm run scan:bundle -w n8n-nodes-docengine

      - name: Publish to npm with provenance
        working-directory: apps/n8n-nodes-docengine
        run: |
          # Clear token auth so OIDC Trusted Publishing can run.
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f "$HOME/.npmrc" .npmrc || true

          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
            echo "Using NPM_TOKEN secret for publish auth"
          else
            echo "Using npm Trusted Publishing (OIDC) — no NPM_TOKEN set"
            echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-}"
            echo "OIDC URL set: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          fi

          # Publish from package dir (not -w) so OIDC auth applies cleanly.
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
